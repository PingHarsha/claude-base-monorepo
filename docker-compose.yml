services:
  postgres:
    image: postgres:16-alpine
    container_name: example-desk-postgres
    environment:
      POSTGRES_DB: example_desk
      POSTGRES_USER: example_desk
      POSTGRES_PASSWORD: example_desk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example_desk -d example_desk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
