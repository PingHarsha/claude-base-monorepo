name: PR checks

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Lint (Spotless)
        run: mvn -B spotless:check

      - name: Tests + coverage threshold
        run: mvn -B verify
