spring.application.name=example-desk-problem
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Database connection. Env vars override the defaults, which match docker-compose.yml for zero-config local dev.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/example_desk}
spring.datasource.username=${DB_USER:example_desk}
spring.datasource.password=${DB_PASSWORD:example_desk}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate. Flyway owns schema; Hibernate validates entity-to-table mapping at startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Flyway.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
